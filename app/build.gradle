plugins { id 'com.android.application' }

android {
    namespace 'com.blasllavero.bioqra'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blasllavero.bioqra'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Apache License 2.0; numerical distributions for conservative Welch tests.
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'org.commonmark:commonmark:0.24.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.24.0'
    // FOSS local extraction of publicly accessible challenge guideline PDFs.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
