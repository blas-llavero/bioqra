plugins { id 'com.android.application' }

android {
    namespace 'com.blasllavero.bioqra'
    compileSdk 35

    defaultConfig {
        applicationId 'com.blasllavero.bioqra'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
    // FOSS local extraction of publicly accessible challenge guideline PDFs.
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}
