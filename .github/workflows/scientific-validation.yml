name: Independent GEO / limma scientific audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/geo_fetch_for_r.py'
      - 'tools/geo_limma_audit.R'
      - 'tools/geo_pairing.R'
      - 'tools/test_geo_pairing.R'
      - 'tools/test_paired_limma.R'
      - '.github/workflows/scientific-validation.yml'

permissions:
  contents: read

jobs:
  verify-real-geo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install free R and Bioconductor limma packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends r-base-core r-bioc-limma r-cran-jsonlite
      - name: Verify patient-pair metadata eligibility with numerical test fixtures
        run: Rscript tools/test_geo_pairing.R
      - name: Test patient fixed-effect limma coefficients on nonclinical fixture
        run: Rscript tools/test_paired_limma.R
      - name: Download authentic public NCBI GEO GSE17351
        run: python3 tools/geo_fetch_for_r.py --accession GSE17351 --out validation-input
      - name: Audit sample metadata and run limma only when scientifically eligible
        run: |
          Rscript tools/geo_limma_audit.R \
            validation-input/GSE17351_series_matrix.txt.gz validation-results
      - name: Publish scientific eligibility summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib, os
          audit=pathlib.Path("validation-results/limma-audit.json")
          report={"status":"NOT_RUN","reason":"Audit output is missing"}
          if audit.exists():
              report=json.loads(audit.read_text(encoding="utf-8"))
          status=report.get("status","UNKNOWN")
          reason=report.get("reason","No reason recorded")
          summary=pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Real GEO / R limma eligibility\n\n")
              out.write(f"**Status:** {status}\n\n")
              out.write(f"**Reason:** {reason}\n\n")
              out.write("**Scientific or clinical validation:** Not established.\n")
          if status!="EXPLORATORY_ANALYSIS_COMPLETED":
              print(f"::warning::Real GEO differential-expression analysis not performed: {status}: {reason}")
          PY
      - name: Record package versions and source provenance
        if: always()
        run: |
          mkdir -p validation-results
          if command -v Rscript >/dev/null 2>&1; then
            Rscript -e 'cat(R.version.string,"\n");if(requireNamespace("limma",quietly=TRUE))cat("limma",as.character(packageVersion("limma")),"\n")' > validation-results/R-versions.txt
          fi
          if test -f validation-input/provenance.json; then
            cp validation-input/provenance.json validation-results/source-provenance.json
          fi
      - name: Publish independent audit (not scientific validation)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bioqra-independent-geo-audit
          path: validation-results/
          if-no-files-found: warn
          retention-days: 30
