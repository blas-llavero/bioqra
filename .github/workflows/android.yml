name: Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify approved video is packaged in APK
        run: |
          python3 - <<'PY'
          import zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          resource = "res/raw/bioqra_app_description_en.mp4"
          with zipfile.ZipFile(apk) as archive:
              files = {entry.filename: entry.file_size for entry in archive.infolist()}
              size = files.get(resource, 0)
              if size < 100_000:
                  raise SystemExit(f"ERROR: Approved video missing or too small: {resource} ({size} bytes)")
              print(f"Verified approved introduction inside APK: {resource} ({size} bytes)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bioqra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
